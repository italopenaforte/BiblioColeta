name: Criar aplicativo Windows

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar código
        shell: pwsh
        run: python -m unittest -q
      - name: Criar pacote
        shell: pwsh
        run: .\construir_windows.ps1
      - name: Verificar navegador incluído
        timeout-minutes: 3
        shell: pwsh
        run: |
          $check = Start-Process -FilePath '.\dist\BiblioColeta\BiblioColeta.exe' -ArgumentList '--check' -Wait -PassThru
          Write-Host "Código de saída da verificação: $($check.ExitCode)"
          if ($check.ExitCode -ne 0) {
            $errorFile = '.\dist\BiblioColeta\check-error.txt'
            if (Test-Path $errorFile) {
              Get-Content $errorFile
            } else {
              Write-Host 'O executável terminou sem gerar check-error.txt.'
            }
            throw "A verificação do aplicativo empacotado falhou (código $($check.ExitCode))."
          }
          Write-Host 'Navegador e coleta empacotada verificados com sucesso.'
      - uses: actions/upload-artifact@v4
        with:
          name: BiblioColeta-Windows
          path: BiblioColeta-Windows.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BiblioColeta-Windows
      - name: Publicar pacote na Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" BiblioColeta-Windows.zip --clobber
          else
            gh release create "$RELEASE_TAG" BiblioColeta-Windows.zip \
              --target "$RELEASE_SHA" \
              --title "BiblioColeta — $RELEASE_TAG" \
              --notes 'Baixe BiblioColeta-Windows.zip, extraia a pasta inteira e abra BiblioColeta.exe. Não é necessário instalar Python.'
          fi
