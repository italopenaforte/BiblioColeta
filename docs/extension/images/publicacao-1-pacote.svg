<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Baixar o ZIP da Release e enviá-lo ao Painel do Desenvolvedor</title>
  <desc id="desc">Ilustração com dois quadros. No primeiro, a Release chrome-build-1 destaca BiblioColeta-Chrome.zip. Uma seta leva ao segundo quadro, onde aparecem Adicionar novo item e Escolher arquivo.</desc>
  <rect width="960" height="520" rx="20" fill="#f4f7f2"/>
  <text x="40" y="57" fill="#173124" font-family="Arial, sans-serif" font-size="28" font-weight="700">1. Separe o arquivo da extensão</text>
  <text x="40" y="87" fill="#536b59" font-family="Arial, sans-serif" font-size="17">O ZIP da Release é o arquivo enviado para a Chrome Web Store.</text>
  <rect x="40" y="125" width="390" height="325" rx="16" fill="#fff" stroke="#dce6dc" stroke-width="2"/>
  <rect x="40" y="125" width="390" height="56" rx="16" fill="#e4efe7"/>
  <rect x="40" y="162" width="390" height="19" fill="#e4efe7"/>
  <text x="62" y="160" fill="#173124" font-family="Arial, sans-serif" font-size="21" font-weight="700">GitHub · Releases</text>
  <text x="62" y="224" fill="#173124" font-family="Arial, sans-serif" font-size="18">BiblioColeta para Chrome</text>
  <text x="62" y="253" fill="#536b59" font-family="Arial, sans-serif" font-size="16">chrome-build-1</text>
  <rect x="62" y="286" width="346" height="71" rx="10" fill="#eaf6ed" stroke="#185b3a" stroke-width="3"/>
  <text x="80" y="329" fill="#185b3a" font-family="Arial, sans-serif" font-size="19" font-weight="700">⬇ BiblioColeta-Chrome.zip</text>
  <text x="62" y="402" fill="#536b59" font-family="Arial, sans-serif" font-size="15">Clique no arquivo e aguarde o download.</text>
  <path d="M446 286h54m-14-14 14 14-14 14" fill="none" stroke="#185b3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="125" width="400" height="325" rx="16" fill="#fff" stroke="#dce6dc" stroke-width="2"/>
  <rect x="520" y="125" width="400" height="56" rx="16" fill="#e4efe7"/>
  <rect x="520" y="162" width="400" height="19" fill="#e4efe7"/>
  <text x="542" y="160" fill="#173124" font-family="Arial, sans-serif" font-size="20" font-weight="700">Painel do Desenvolvedor</text>
  <text x="542" y="222" fill="#173124" font-family="Arial, sans-serif" font-size="17">Chrome Web Store</text>
  <rect x="542" y="247" width="340" height="47" rx="9" fill="#185b3a"/>
  <text x="562" y="277" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">+ Adicionar novo item</text>
  <rect x="542" y="314" width="340" height="47" rx="9" fill="#eaf6ed" stroke="#185b3a" stroke-width="2"/>
  <text x="563" y="344" fill="#185b3a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Escolher arquivo · ZIP</text>
  <text x="542" y="403" fill="#536b59" font-family="Arial, sans-serif" font-size="15">Envie o ZIP sem extrair.</text>
  <text x="40" y="489" fill="#536b59" font-family="Arial, sans-serif" font-size="14">Ilustração orientativa; o painel da Google pode ter aparência diferente.</text>
</svg>
