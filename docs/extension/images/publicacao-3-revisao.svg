<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Escolher a distribuição e enviar para revisão</title>
  <desc id="desc">Ilustração em três quadros: escolher Public ou Unlisted na aba Distribution, clicar em Submit for Review e aguardar a análise da Chrome Web Store.</desc>
  <rect width="960" height="520" rx="20" fill="#f4f7f2"/>
  <text x="40" y="57" fill="#173124" font-family="Arial, sans-serif" font-size="28" font-weight="700">3. Escolha quem pode instalar</text>
  <text x="40" y="87" fill="#536b59" font-family="Arial, sans-serif" font-size="17">Depois de conferir tudo, envie a extensão para análise.</text>
  <rect x="40" y="143" width="265" height="285" rx="16" fill="#fff" stroke="#dce6dc" stroke-width="2"/>
  <rect x="40" y="143" width="265" height="58" rx="16" fill="#e4efe7"/>
  <rect x="40" y="182" width="265" height="19" fill="#e4efe7"/>
  <text x="60" y="180" fill="#173124" font-family="Arial, sans-serif" font-size="20" font-weight="700">Distribution</text>
  <circle cx="67" cy="240" r="11" fill="#fff" stroke="#185b3a" stroke-width="3"/>
  <circle cx="67" cy="240" r="5" fill="#185b3a"/>
  <text x="89" y="247" fill="#173124" font-family="Arial, sans-serif" font-size="17">Public</text>
  <text x="60" y="276" fill="#536b59" font-family="Arial, sans-serif" font-size="14">Aparece na loja.</text>
  <circle cx="67" cy="324" r="11" fill="#fff" stroke="#185b3a" stroke-width="3"/>
  <text x="89" y="331" fill="#173124" font-family="Arial, sans-serif" font-size="17">Unlisted</text>
  <text x="60" y="360" fill="#536b59" font-family="Arial, sans-serif" font-size="14">Instalação pelo link.</text>
  <path d="M318 283h39m-12-12 12 12-12 12" fill="none" stroke="#185b3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="370" y="143" width="265" height="285" rx="16" fill="#fff" stroke="#dce6dc" stroke-width="2"/>
  <rect x="370" y="143" width="265" height="58" rx="16" fill="#e4efe7"/>
  <rect x="370" y="182" width="265" height="19" fill="#e4efe7"/>
  <text x="390" y="180" fill="#173124" font-family="Arial, sans-serif" font-size="20" font-weight="700">Conferência</text>
  <text x="390" y="239" fill="#536b59" font-family="Arial, sans-serif" font-size="16">Pacote, imagens, descrição</text>
  <text x="390" y="270" fill="#536b59" font-family="Arial, sans-serif" font-size="16">e privacidade preenchidos.</text>
  <rect x="390" y="312" width="225" height="56" rx="9" fill="#185b3a"/>
  <text x="405" y="346" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Submit for Review</text>
  <path d="M648 283h39m-12-12 12 12-12 12" fill="none" stroke="#185b3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="700" y="143" width="220" height="285" rx="16" fill="#fff" stroke="#dce6dc" stroke-width="2"/>
  <rect x="700" y="143" width="220" height="58" rx="16" fill="#e4efe7"/>
  <rect x="700" y="182" width="220" height="19" fill="#e4efe7"/>
  <text x="720" y="180" fill="#173124" font-family="Arial, sans-serif" font-size="20" font-weight="700">Revisão</text>
  <text x="720" y="246" fill="#173124" font-family="Arial, sans-serif" font-size="16">A Google analisa</text>
  <text x="720" y="274" fill="#173124" font-family="Arial, sans-serif" font-size="16">a extensão.</text>
  <rect x="720" y="312" width="180" height="65" rx="9" fill="#eaf6ed"/>
  <text x="735" y="340" fill="#185b3a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Acompanhe o</text>
  <text x="735" y="361" fill="#185b3a" font-family="Arial, sans-serif" font-size="16" font-weight="700">status no painel.</text>
  <text x="40" y="489" fill="#536b59" font-family="Arial, sans-serif" font-size="14">Ilustração orientativa; os botões podem aparecer traduzidos na sua conta.</text>
</svg>
