  <title id="title">Preencher a ficha e a privacidade da extensão</title>
  <desc id="desc">Ilustração do painel com as abas Store Listing e Privacy, mostrando a descrição, a captura de tela, a imagem promocional e o link da política de privacidade.</desc>
